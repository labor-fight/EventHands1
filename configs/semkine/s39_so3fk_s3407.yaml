# S39: the loss moves from elementwise 51D MSE onto the SO(3)/FK manifold. Seed 3407.
#
# Single-variable arm against S37 (`s37_fkdirect_s3407.yaml`): the *only* change is the LOSS
# block. Architecture, conditioning (PREV_FK_DIRECT), data, grid: S37 verbatim.
#
#   L = 1.0 * L_rot + 1.0 * L_trans + 2.0 * L_FK + 1.0 * L_absFK
#
# The dense-raster line measured the bare `so3_trans_fk` in S4/§13: pooled ΔRA −0.78 ± 0.61
# (a tie), and non-aligned MPJPE degraded 63.7 -> 83.6 mm because the SmoothL1's default
# β=1 m puts centimetre errors deep in the quadratic region (vanishing gradient) while the
# root-relative L_FK never constrains absolute translation at all. The two remedies were
# implemented then (`model/model.py`, S4) but "retrain never carried a claim" -- this arm is
# their first measurement, on the EventGNN line:
#
#   TRANS_BETA: 0.01      SmoothL1 transition at the actual error scale -> constant gradient
#   ABS_FK_WEIGHT: 1.0    non-root-relative FK term, in metres, the quantity abs-MPJPE measures
#
# Pre-registered gates (H8-H10, .cursor/debug session ea00d3):
#   H8  adopt if two-seed mean recursive RA <= 28.72 (S37 29.72 - 1.0); |Δ|<1.0 is a tie
#   H9  guard: two-seed mean abs MPJPE <= 50.3 (S37 48.34 + 2.0), else the remedies failed
#   H10 stability: no grid point above 45 mm (S37's grids peak at ~38)
SEED: 3407

DATA:
  ROOT: data/hand_data51
  # Pinned: the default manifest became the 9-subject capture-time split on 2026-08-27 and every
  # arm compared against here was trained on the 5/2/3 one.
  SPLITS_MANIFEST: _retired_splits_semkine_5v2v3.json
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: raw_packed

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: event_gnn
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  # The tracking recipe, unchanged from S37:
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: false
  PREV_FK_DIRECT: true
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: event_gnn
  ENCODER_HIDDEN: 128
  ENCODER_FEAT: 512
  ENCODER_LAYERS: 3
  ENCODER_K: 8
  ENCODER_MAX_NODES: 2048
  ENCODER_WINDOW: 32
  ENCODER_T_SCALE: 1.0
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  # SO(3) + FK objective replacing the elementwise 51D MSE. Each term lives on the manifold
  # of the quantity it measures, so the weights are 1 / 1 / 2 / 1 instead of the hand-tuned
  # 450 / 60 / 30000 the MSE needed to balance radians against metres.
  TYPE: so3_trans_fk
  ROT_WEIGHT: 1.0
  TRANS_WEIGHT: 1.0
  FK_WEIGHT: 2.0
  # The §13 remedies, first time under training:
  TRANS_BETA: 0.01
  ABS_FK_WEIGHT: 1.0
  # LAMBDA_* / NORMALIZER are kept so legacy_loss_51d stays comparable in the logs;
  # they do not enter the training objective.
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  # 512 x 2 cards = the same effective 1024 S34 trained at, so LR does not move.
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 12
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500      # fixed grid: val_loss must not select checkpoints
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s39_so3fk_s3407
  RUN_NAME: s39_so3fk_s3407

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/s39_so3fk_s3407/eval
