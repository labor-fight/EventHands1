# K1_S37_SMALLNOISE (2026-09-25 goal, research_state/JOURNAL.md): S37 routed readout with ONLY the
# prev-noise curriculum mix changed -- small-noise only (P_SMALL 1.0, P_LARGE 0, P_CORR 0): an odometry-like tracker.
# Control for H3 (update-gain miscalibration set by the training prev-error distribution).
# Noise scales (PREV_NOISE_T/R/POSE, LARGE_*) are unchanged, so the evaluator's GT+noise run
# initialisation (semkine/eval_track.sample_init_noise) is identical to S37.
# S37 (routed readout, 2026-09-07): state-free event graph, previous state enters only through
# the FK-routed per-joint readout. Seed 3407; seed 3408 is this file with `--seed 3408`.
# The name S37 is reused on purpose: every arm after S36 was purged on 2026-09-06 and the
# numbering restarts here; the earlier "S37 FK-direct" no longer exists in the tree.
#
# Protocol note: trains on the nine-subject default split (splits_semkine.json) and validates,
# selects and reports on the held-out subject zgz only (docs/FAILURE_AND_CLEANUP_LEDGER.md).
#
# The arm under test (docs/S37_ROUTED_READOUT_PREREG.md): the graph never sees the previous
# state -- no rendered `sil`/`inv` node channels, nodes are the 7-dim event tokens alone
# (PREV_RENDER: false). The previous state's MANO FK is projected and each sampled node is given
# the LBS row of the front-most nearest vertex within 16 px (`semkine.routed_readout`), i.e. the
# joints that could have produced an event at that pixel. Node features after three EdgeConv
# rounds are pooled per joint (weighted mean, max, coverage); joint decoder k reads only its own
# joint's evidence plus its previous angle (no global bypass to a finger), the root reads the
# pooled vector plus all sixteen evidence vectors in joint order.
#
# Two changes against S36 (`s36_eventgnn_s3407.yaml`), both part of the arm by definition:
# MODEL.PREV_RENDER true -> false and MODEL.ROUTED_READOUT (+ its two knobs). Graph, sampling,
# EdgeConv, loss, curriculum, grid, DDP: S36 verbatim
# (`tests/test_s37_routed_readout.py::test_s37_config_differs_from_s36_only_in_the_readout`).
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: raw_packed

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: event_gnn
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  # The tracking recipe, unchanged from S34/S36 except the two lines marked S37.
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: false            # S37: the graph is state-free
  ROUTED_READOUT: true          # S37: prev enters at the readout, as FK-routed joint evidence
  ROUTE_BAND_PX: 16.0
  ROUTE_FRONT_K: 8
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: event_gnn
  ENCODER_HIDDEN: 128
  ENCODER_FEAT: 512
  ENCODER_LAYERS: 3
  ENCODER_K: 8
  ENCODER_MAX_NODES: 2048
  ENCODER_WINDOW: 32
  ENCODER_T_SCALE: 1.0
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 1.0
  PREV_NOISE_P_LARGE: 0.0
  PREV_NOISE_P_CORR: 0.0

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  # 512 x 2 cards = the same effective 1024 S34/S36 trained at, so LR does not move.
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 12
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500      # fixed grid: val_loss must not select checkpoints
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/k1_s37_smallnoise_s3407
  RUN_NAME: k1_s37_smallnoise_s3407

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/k1_s37_smallnoise_s3407/eval
