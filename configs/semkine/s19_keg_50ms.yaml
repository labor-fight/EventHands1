# S19: the KEG frontend on the frozen S1 Track+domrand protocol, at the baseline's 50 ms step.
#
# This arm exists to pass a *parity* gate, not to win. `ARCHITECTURE_AUDIT.md` §7 measures the
# 70-88% of events LNES overwrites, but §7's own caveat records that the teacher-forced probe
# falsified the inference that direction information is destroyed before the network. So the
# expected gain from raw events at 50 ms is rated moderate, and the registered gate is that KEG is
# not significantly worse than the dense arm it replaces (paired CI upper bound below +0.5 mm on
# val_core). The claim this frontend exists for is S20's, at short windows, where LNES cannot go.
#
# Single variable versus `s1_track_domrand.yaml`: the frontend. Everything the audit fixed stays
# fixed -- same splits, same domrand ranges, same teacher-forcing noise, same loss weights, same
# effective batch (256 x 4 = 1024) and LR, same fixed-step checkpoint grid, selection by recursive
# RA on val_core. `INPUT_MODE: both` so the frozen dense teacher reads the LNES of the same window
# and the distillation loss compares two predictions of one input rather than of two samplings.
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: both

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: keg
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: true            # KSSF needs the hand model; the dense faces are not built
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: keg
  ENCODER_HIDDEN: 64           # 64 decay rates, log-spaced over 5 to 2000 1/s
  ENCODER_FEAT: 256
  ENCODER_NODE_DIM: 64
  ENCODER_KSSF: true           # the 12-channel geometric lift at event coordinates
  ENCODER_JOINT_TOKENS: true   # joint k's decoder reads node k and nothing else
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64
  DISTILL_WEIGHT: 1.0
  DISTILL_CKPT: outputs/semkine/s1_track_domrand_s3407/s1_track_domrand_s3407-step=3500.ckpt

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  # 64 x 16 reproduces the baseline's effective 1024. The first attempt used 256 x 4, which is what
  # S20 runs at, and it ran out of memory at 38 GB: this schedule draws windows up to 300 ms rather
  # than S20's 50 ms, so a packet holds up to six times the events, and `INPUT_MODE: both` carries a
  # 180x240x2 LNES for the frozen teacher on top of the ragged batch and the KSSF raster. The
  # effective batch and the learning rate are the quantities the parity gate needs held fixed
  # against the dense arm, and both are unchanged.
  BATCH_SIZE_PER_GPU: 64
  ACCUMULATE_GRAD_BATCHES: 16
  NUM_WORKERS: 8
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3                   # identical to the dense arm at the same effective batch
  WARMUP_STEPS: 500
  MAX_STEPS: 4000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s19_keg_50ms
  RUN_NAME: s19_keg_50ms

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/s19_keg_50ms/eval
