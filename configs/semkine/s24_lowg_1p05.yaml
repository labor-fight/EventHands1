# S24: the retention-penalised tracker. Single variable versus `s1_track_domrand`: TRACK.GAIN_REG_W.
#
# Why this arm exists. Across 11 checkpoints and 2 seeds the recursive error is ranked by retention
# -- how much of a conditioning-state error survives one step -- at Spearman +0.93 (s3407, n=7) and
# +1.00 (s3408, n=4), and *anti*-ranked by single-step teacher-forced error at -0.61 and -1.00. The
# s23 unroll arm has the best single-step error in the whole set (10.87 mm) and the worst tracking
# (34.30 mm); this baseline has the worst single-step error (14.94 mm) and the best tracking
# (16.64 mm). Every recipe so far moved retention only as a side effect; this one puts it in the
# objective.
#
# The penalty is measured in ROOT-ALIGNED JOINT SPACE, which is the whole point. A first pass took
# the same ratio in the raw 51-D parameter space and, at matched step 2000, drove joint-space
# retention *above* the unregularised baseline (0.457 / 0.439 / 0.335 / 0.221 against 0.242) while
# still being perfectly monotone in lambda -- it optimised a direction nearly orthogonal to drift,
# because that norm mixes metres with radians and is ~97% pose block. See `model/model.py`
# `_gain_penalty` and `outputs/semkine/lowg_gain_step2000_paramspace.json`.
#
# Lambda is calibrated, not guessed: at the s3407 step-2000 checkpoint the task loss is 0.1089 and
# the joint-space penalty is 0.1034 (implied retention 0.322, against the probe's independent
# G_rand = 0.242 on that same checkpoint). LAMBDA below is 100% of the task loss there.
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: legacy_lnes

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: resnet18
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: true
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2
  GAIN_REG_W: 1.053
  GAIN_REG_SCALE: 1.0

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 1024
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 8
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3                   # 1e-3 * sqrt(1024/64), one device
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500      # fixed grid: val_loss must not select checkpoints
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s24_lowg_1p05
  RUN_NAME: s24_lowg_1p05

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/s24_lowg_1p05/eval
