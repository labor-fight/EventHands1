# S38b rootlever (2026-09-20, docs/S38_MESH3D_PREREG.md): the S37 mesh graph, graph untouched,
# with the root head made able to use lever arms -- the minimal test of the bilinear-rotation
# hypothesis. Seed 3407; seed 3408 is this file with `--seed 3408`.
#
# Protocol note: trains on the nine-subject default split (splits_semkine.json) and validates,
# selects and reports on the held-out subject zgz only (docs/FAILURE_AND_CLEANUP_LEDGER.md).
#
# Against S37 meshgraph (`configs/semkine/s37_meshgraph_s3407.yaml`) exactly one thing changes:
#   (B') MESH_GRAPH_ROOT_LEVER  the root head additionally reads, for each of the sixteen parts,
#        u_j = relu(W [e_j ; r_j]) with one shared W (width 64) and r_j the part's skinning-weighted
#        centroid about the posed root joint (camera frame, centimetres); an unseen part gives
#        u_j = 0 exactly. A linear root head over the sixteen part means cannot form "coefficient
#        that depends on the hand's orientation x displacement"; this term can, per part, before
#        the linear read. Edges, nodes, pool, finger heads: S37 meshgraph verbatim
#        (`tests/test_s38_mesh3d.py::test_s38_rootlever_config_diff_against_meshgraph`).
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: raw_packed

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: event_gnn
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: false            # nothing is rendered
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375           # still the projection intrinsics used to place the vertices
  RENDER_CHUNK: 256
  ENCODER: mesh_graph           # S37 meshgraph: the full FK mesh is the graph, events are its observations
  MESH_GRAPH_ROOT_LEVER: 64     # S38b (B'): root also reads relu(W[e_j ; r_j]) per part, r_j = part centroid about the root joint
  MESH_GRAPH_GEO_SCALE: 100.0   # metres -> centimetres for every S38 geometric feature
  MESH_GRAPH_BAND_PX: 16.0
  MESH_GRAPH_FRONT_PX: 1.0
  MESH_GRAPH_Z_TOL: 0.01
  MESH_GRAPH_OBS_FLOW: false
  MESH_GRAPH_NODE_ID: true
  ENCODER_HIDDEN: 128
  ENCODER_LAYERS: 3
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  # 512 x 2 cards = the same effective 1024 S34/S36 trained at, so LR does not move.
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 12
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500      # fixed grid: val_loss must not select checkpoints
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s38_rootlever_s3407
  RUN_NAME: s38_rootlever_s3407

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/s38_rootlever_s3407/eval
