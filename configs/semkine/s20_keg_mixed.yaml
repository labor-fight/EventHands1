# S20: the variable-rate claim. Same KEG frontend, trained on a log-uniform window schedule over
# 5-50 ms instead of the baseline's 30-300 ms, and evaluated on the whole {5, 10, 20, 50} ms grid.
#
# This is the arm the method exists for. `FAILURE_CASES.md` records that motion is not sparse at
# 50 ms and that the S7 oracle's benefit at that step is marginal; both findings point at shorter
# steps, and short steps are where LNES has nothing left to say -- a 5 ms window holds a tenth of
# the events, so last-writer-wins overwrites less but the millisecond quantisation of its only
# channel now spans the entire window. KEG's readout is a function of microsecond ages, and its
# recurrence is linear time-invariant, which is what makes re-discretising at another step size
# meaningful at all (Zubic et al., CVPR'24, measure 3.31 vs 21 mAP lost across such a mismatch).
#
# The window schedule stays log-uniform rather than a draw from the four evaluation step sizes: a
# model trained only on the grid it is tested on cannot support a claim about rates in between.
#
# Controls, trained by `s20_lnes_mixed.yaml` on this identical schedule so the single variable is
# the frontend, plus the frozen 50 ms teacher evaluated at 5 ms as the no-retraining reference.
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 5
  WINDOW_MAX: 50
  USE_MEMMAP: true
  INPUT_MODE: raw_packed

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: keg
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: true            # KSSF needs the hand model; the dense faces are not built
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: keg
  ENCODER_HIDDEN: 64           # 64 decay rates, log-spaced over 5 to 2000 1/s
  ENCODER_FEAT: 256
  ENCODER_NODE_DIM: 64
  ENCODER_KSSF: true           # the 12-channel geometric lift at event coordinates
  ENCODER_JOINT_TOKENS: true   # joint k's decoder reads node k and nothing else
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64
  # No distillation here, deliberately. The teacher is a 50 ms LNES model trained on 30-300 ms
  # windows; asked for a target at a 5 ms window it is being queried far outside its own training
  # distribution, so its prediction is not a signal to imitate. Distillation earned its place in
  # S19 as a budget device for the parity gate, and using it here would make the variable-rate
  # claim depend on a teacher that cannot make it.

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  # 256 x 4 reproduces the baseline's effective 1024 at a per-step memory the ragged event batch
  # and the KSSF raster can hold together: a batch of 1024 windows can carry 10 M events.
  BATCH_SIZE_PER_GPU: 256
  ACCUMULATE_GRAD_BATCHES: 4
  NUM_WORKERS: 8
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3                   # identical to the dense arm at the same effective batch
  WARMUP_STEPS: 500
  MAX_STEPS: 4000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s20_keg_mixed
  RUN_NAME: s20_keg_mixed

EVAL:
  WINDOW_MS: 5
  OUTPUT_DIR: outputs/semkine/s20_keg_mixed/eval
