# User-confirmed full-778 event-guided mesh, 2026-09-23.
# prev_{k-1} -> MANO 778 vertices; packet E_k supplies 2D observations (k: update step).
# All vertices remain: 32 spatial candidates -> event-conditioned ranking -> 8 neighbours.
# 3D EdgeConv x3 -> fixed normalized LBS mean -> 16 x 128 features -> 51D delta.
# Delta heads read only pooled features: no prev MLP, prev-angle or background bypass.
# Training/loss/curriculum/split match s37_meshgraph; this is a new untrained arm.
# See docs/EVENT_GUIDED_MESH_MEMORY_PREREG.md §1 for the exact construction and test contract.
SEED: 3407
DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: raw_packed
AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 0.0002
MODEL:
  BACKBONE: event_gnn
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: false
  PREV_RENDER: false
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: event_guided_mesh
  MESH_GRAPH_BAND_PX: 16.0
  MESH_GRAPH_FRONT_PX: 1.0
  MESH_GRAPH_Z_TOL: 0.01
  ENCODER_HIDDEN: 128
  ENCODER_LAYERS: 3
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64
  ENCODER_K: 8
  EGM_CANDIDATES: 32
  EGM_EVENT_WEIGHT: 1.0
  EGM_GEOMETRY_SCALE: 0.02
TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2
MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true
LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true
TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 12
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 0.004
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/event_guided_mesh_s3407
  RUN_NAME: event_guided_mesh_s3407
EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/event_guided_mesh_s3407/eval
