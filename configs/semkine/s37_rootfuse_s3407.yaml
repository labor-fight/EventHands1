# S37 root input fusion (2026-09-29, the user's variant; docs/S37_EDGE6_ROOTFUSE_PREREG_20260929.md).
# Seed 3407; seed 3408 is this file with `--seed 3408`.
#
# Single variable against `s37_routed_s3407.yaml`: MODEL.ROOT_FUSION concat -> per_joint. The S37
# root head is one linear map of [f; e_0 .. e_15] (512 + 16 x 257 -> 6). Here joint j's routed
# evidence e_j is fused with the pooled vector f by its own MLP, [f; e_j] -> 64 -> ReLU -> 6, and
# the sixteen outputs are summed into the root update. Graph, routing, finger heads, prev_mlp,
# loss, curriculum, schedule, grid, DDP: S37 verbatim
# (`tests/test_s37_edge6_rootfuse.py::test_rootfuse_differs_from_s37_only_in_root_fusion`).
SEED: 3407

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: raw_packed

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 2.0e-4

MODEL:
  BACKBONE: event_gnn
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  # The tracking recipe, unchanged from S34/S36 except the two lines marked S37.
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: false            # S37: the graph is state-free
  ROUTED_READOUT: true          # S37: prev enters at the readout, as FK-routed joint evidence
  ROUTE_BAND_PX: 16.0
  ROUTE_FRONT_K: 8
  ROOT_FUSION: per_joint         # the arm: per-joint [f; e_j] MLPs, summed
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  ENCODER: event_gnn
  ENCODER_HIDDEN: 128
  ENCODER_FEAT: 512
  ENCODER_LAYERS: 3
  ENCODER_K: 8
  ENCODER_MAX_NODES: 2048
  ENCODER_WINDOW: 32
  ENCODER_T_SCALE: 1.0
  ACTIVE_HEAD: true
  ACTIVE_HIDDEN: 64

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  # 512 x 2 cards = the same effective 1024 S34/S36 trained at, so LR does not move.
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 12
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 4.0e-3
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 1000
  SAVE_EVERY_N_STEPS: 500      # fixed grid: val_loss must not select checkpoints
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/s37_rootfuse_s3407
  RUN_NAME: s37_rootfuse_s3407

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/s37_rootfuse_s3407/eval
