# dt_dz_l3_roll: DT2 package E, arm 3 (detach-style closed-loop rollout of the conditioning state on triplet batches).
# = configs/dt/dt_dz_l3.yaml + {'DATA': {'TRIPLET': True, 'TRIPLET_FRAC': 0.5}, 'TRACK': {'ROLLOUT_P': 0.5, 'ROLLOUT_RAMP': [500, 2000]}} (no ACCEL_WEIGHT): half of the samples are triplets (three consecutive equally long windows, data CPU cost about 1.9x); from step 500 to 2000 the probability that a valid row's w2 prev is replaced by the tracker's own two-step bare feed-back (o0 = f(w0, prev0), o1 = f(w1, o0); no grad, fp32, BatchNorm running statistics untouched) rises linearly to 0.5 (model.py _maybe_rollout); the loss is the plain single-step loss on w2's target. TRAIN.OUTPUT_DIR / RUN_NAME / EVAL.OUTPUT_DIR are set to the arm's name; seeds and output paths are set on the command line by tools/dt/jobs2.py.
# Needs model/model.py (TRACK.ROLLOUT_P, ROLLOUT_RAMP) of DT2 package E and semkine/dataset.py (DATA.TRIPLET) of the DT round.
SEED: 3407
DATA:
  ROOT: /data1/lyq/code/mesh/EventHands/data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: legacy_lnes
  SPLITS_MANIFEST: /data1/lyq/code/mesh/EventHands/data/hand_data51/splits_semkine.json
  TRIPLET: true
  TRIPLET_FRAC: 0.5
AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 0.0002
    SCALE_MODE: depth
MODEL:
  BACKBONE: resnet18
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: true
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  CNN_BACKBONE: resnet18_l3
TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2
  ROLLOUT_P: 0.5
  ROLLOUT_RAMP: [500, 2000]
MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true
LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true
  TYPE: so3_trans_fk
  ROT_WEIGHT: 1.0
  TRANS_WEIGHT: 1.0
  FK_WEIGHT: 2.0
TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 2
  NUM_WORKERS: 14
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 0.004
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 2000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/dt_dz_l3_roll
  RUN_NAME: dt_dz_l3_roll
  LR_SCHEDULE: cosine
  LIMIT_VAL_BATCHES: 8
EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/dt_dz_l3_roll/eval
