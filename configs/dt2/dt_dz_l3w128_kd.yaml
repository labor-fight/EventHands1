# dt_dz_l3w128_kd: DT2 package E, arm 2 (dense distillation of the 2.80 M dt_dz_l3 tracker into the 1.30 M l3w128 trunk).
# = configs/dt2/dt_dz_l3w128.yaml + {'MODEL': {'DISTILL_WEIGHT': 1.0, 'DISTILL_CKPT': '<dt_dz_l3_s{SEED}/last.ckpt>'}}: the frozen teacher is the trained dt_dz_l3 of the SAME seed (semkine/train.py replaces {SEED} by the run's seed and logs the resolved path; the teacher's own trunk resnet18_l3 is read from its checkpoint), its output on the student's input (lnes, prev, betas, K) is the target of an extra rotation + translation + FK term (model.py _distill_dense) added to the loss with weight 1.0 before the log10, logged as train_loss_distill. TRAIN.OUTPUT_DIR / RUN_NAME / EVAL.OUTPUT_DIR are set to the arm's name; seeds and output paths are set on the command line by tools/dt/jobs2.py.
# Needs model/backbones.py (resnet18_l3w128) and semkine/train.py ({SEED}, teacher trunk from the checkpoint) of DT2 package E.
SEED: 3407
DATA:
  ROOT: /data1/lyq/code/mesh/EventHands/data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: legacy_lnes
  SPLITS_MANIFEST: /data1/lyq/code/mesh/EventHands/data/hand_data51/splits_semkine.json
AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 0.0002
    SCALE_MODE: depth
MODEL:
  BACKBONE: resnet18
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: true
  ZERO_EVENT_GATE: true
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  CNN_BACKBONE: resnet18_l3w128
  DISTILL_WEIGHT: 1.0
  DISTILL_CKPT: "/data1/lyq/code/mesh/EventHands1/outputs/semkine/dt_dz_l3_s{SEED}/last.ckpt"
TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2
MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true
LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true
  TYPE: so3_trans_fk
  ROT_WEIGHT: 1.0
  TRANS_WEIGHT: 1.0
  FK_WEIGHT: 2.0
TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 2
  NUM_WORKERS: 14
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 0.004
  WARMUP_STEPS: 500
  MAX_STEPS: 6000
  VAL_CHECK_INTERVAL: 2000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/dt_dz_l3w128_kd
  RUN_NAME: dt_dz_l3w128_kd
  LR_SCHEDULE: cosine
  LIMIT_VAL_BATCHES: 8
EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/dt_dz_l3w128_kd/eval
