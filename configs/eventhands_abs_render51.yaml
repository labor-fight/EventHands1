SEED: 0

DATA:
  ROOT: data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true

AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true

MODEL:
  BACKBONE: resnet18
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: false         # absolute output (same as EventHands-Full)
  PREVPOS_EMBED: false         # no prev MLP on output
  PREV_RENDER: true            # 4ch input: LNES + rendered prev pose
  ZERO_EVENT_GATE: false
  RENDER_H: 180
  RENDER_W: 240
  RENDER_SCALE: 0.375
  RENDER_CHUNK: 256
  INIT_FROM: outputs/hand_data51/abs_full51/abs_full51-step=6000-val_loss=val_loss=1.1009.ckpt

TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed       # same as track_render51 for fair closed-loop training
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2

MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true

LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true

TRAIN:
  DEVICES: 2
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 1024
  ACCUMULATE_GRAD_BATCHES: 1
  NUM_WORKERS: 8
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 5.656e-3                 # 1e-3 * sqrt((1024*2)/64)
  WARMUP_STEPS: 500
  MAX_STEPS: 15000
  VAL_CHECK_INTERVAL: 1000
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/hand_data51/abs_render51
  RUN_NAME: abs_render51

EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/hand_data51/abs_render51/eval
