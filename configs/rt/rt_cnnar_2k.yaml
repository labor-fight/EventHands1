# rt_cnnar_2k: ResNet18 / LNES, absolute head + delta head, output blended 0.5 / 0.5 and fed back.
# Generated by tools/rt/make_configs.py from configs/x1001/x1001_cnn.yaml with {'MODEL': {'PREDICT_DELTA': True, 'PREVPOS_EMBED': True, 'ZERO_EVENT_GATE': True, 'ABS_TRACK': True, 'ABS_TRACK_ALPHA_ROOT': 0.5, 'ABS_TRACK_ALPHA_REST': 0.5}}, TRAIN.MAX_STEPS 2000 (screening budget).
# Seeds and output paths are set on the command line.
SEED: 3407
DATA:
  ROOT: /data1/lyq/code/mesh/EventHands/data/hand_data51
  WIDTH: 240
  HEIGHT: 180
  WINDOW_MIN: 30
  WINDOW_MAX: 300
  USE_MEMMAP: true
  INPUT_MODE: legacy_lnes
  SPLITS_MANIFEST: /data1/lyq/code/mesh/EventHands/data/hand_data51/splits_semkine.json
AUG:
  SPEED_AUG: true
  POLARITY_FLIP: true
  PIXEL_POLARITY_SWAP: true
  DOMRAND:
    ENABLED: true
    ROLL_DEG: 15.0
    SCALE_MIN: 0.8
    SCALE_MAX: 1.25
    SHIFT_PX: 14.0
    KEEP_MIN: 0.25
    KEEP_MAX: 1.0
    HOT_PIXEL_RATE: 0.0002
MODEL:
  BACKBONE: resnet18
  POSE_REPR: mano_full_axis_angle
  OUTPUT_DIM: 51
  MANO_NCOMPS: 45
  PREDICT_BETA: false
  PREDICT_DELTA: true
  PREVPOS_EMBED: true
  PREV_RENDER: false
  ZERO_EVENT_GATE: true
  ABS_TRACK: true
  ABS_TRACK_ALPHA_ROOT: 0.5
  ABS_TRACK_ALPHA_REST: 0.5
TRACK:
  PREV_NOISE_T: 0.005
  PREV_NOISE_R: 0.05
  PREV_NOISE_POSE: 0.05
  PREV_NOISE_MODE: mixed
  PREV_NOISE_LARGE_T: 0.05
  PREV_NOISE_LARGE_R: 0.3
  PREV_NOISE_LARGE_POSE: 0.3
  PREV_NOISE_P_SMALL: 0.5
  PREV_NOISE_P_LARGE: 0.3
  PREV_NOISE_P_CORR: 0.2
MANO:
  NPZ: assets/mano_right.npz
  BETA_SOURCE: sequence_gt
  ADD_MEAN: true
LOSS:
  LAMBDA_POSE: 450.0
  LAMBDA_T: 30000.0
  LAMBDA_R: 60.0
  NORMALIZER: 51
  LOG10: true
TRAIN:
  DEVICES: 1
  STRATEGY: ddp
  PRECISION: bf16
  BATCH_SIZE_PER_GPU: 512
  ACCUMULATE_GRAD_BATCHES: 2
  NUM_WORKERS: 14
  PERSISTENT_WORKERS: true
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  OPTIMIZER: adam
  LR: 0.004
  WARMUP_STEPS: 500
  MAX_STEPS: 2000
  VAL_CHECK_INTERVAL: 2000
  SAVE_EVERY_N_STEPS: 500
  SYNC_BATCHNORM: false
  OUTPUT_DIR: outputs/semkine/rt_cnnar_2k
  RUN_NAME: rt_cnnar_2k
  LR_SCHEDULE: cosine
  LIMIT_VAL_BATCHES: 8
EVAL:
  WINDOW_MS: 50
  OUTPUT_DIR: outputs/semkine/rt_cnnar_2k/eval
